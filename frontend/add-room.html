<!DOCTYPE html>
<html>
<head>
    <title>Add Room | CampusOra</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Add New Room</h2>

<form id="addRoomForm" enctype="multipart/form-data">
    <input type="text" name="title" placeholder="Room Title" required>

    <select name="bhk" required>
        <option value="">Select BHK</option>
        <option>1 BHK</option>
        <option>2 BHK</option>
        <option>3 BHK</option>
    </select>

    <input type="number" name="rent" placeholder="Rent" required>
    <input type="text" name="distance" placeholder="Distance from college" required>
    <input type="text" name="location" placeholder="Location" required>

    <textarea name="description" placeholder="Room description" required></textarea>

<input type="file" name="image" accept="image/*" required>

    <button type="submit">Add Room</button>
</form>

<script src="js/main.js"></script>
</body>
</html>
